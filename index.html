<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Continental Blox League</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0d14;--card:#121826;--bd:#222b3d;--tx:#f3f5f9;--mu:#8d97ab;--ac:#e5243b;--bl:#3b82f6;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Barlow","Segoe UI",system-ui,sans-serif}
a{color:inherit;text-decoration:none}h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif;text-transform:uppercase;letter-spacing:.03em;margin:0 0 .5rem}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:#0a0d14ee;backdrop-filter:blur(8px);border-bottom:1px solid var(--bd)}
.nw{max-width:1180px;margin:auto;display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font:700 22px "Barlow Condensed",Impact,sans-serif;letter-spacing:.06em}
.logo i{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--bl));display:grid;place-items:center;font-style:normal;font-size:13px}
.links{display:flex;gap:2px;overflow-x:auto;flex:1}.links a{padding:6px 10px;border-radius:6px;color:var(--mu);white-space:nowrap;font-size:14px}.links a:hover,.links a.on{color:var(--tx);background:var(--card)}
input,select,button,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px}
button{cursor:pointer;background:var(--ac);border-color:var(--ac);font-weight:600}button.g{background:var(--card);border-color:var(--bd)}button:hover{filter:brightness(1.15)}
main{max-width:1180px;margin:auto;padding:20px 16px 60px;animation:f .35s}@keyframes f{from{opacity:0;transform:translateY(6px)}}
.hero{border:1px solid var(--bd);border-radius:16px;padding:48px 28px;background:radial-gradient(circle at 85% 0,#3b82f633,transparent 50%),radial-gradient(circle at 0 100%,#e5243b2e,transparent 50%),var(--card);margin-bottom:24px}
.hero h1{font-size:clamp(34px,7vw,64px);line-height:1}.hero p{color:var(--mu);max-width:560px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.g3{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;transition:border-color .2s,transform .2s}a.card:hover{border-color:var(--bl);transform:translateY(-2px)}
.sec{margin:28px 0 10px;display:flex;justify-content:space-between;align-items:baseline}.mu{color:var(--mu)}.sm{font-size:13px}
.bd{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;font:700 12px sans-serif;color:#fff;flex:none}.bd.l{width:84px;height:84px;font-size:26px}
.fx{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}.fx:last-child{border:0}
.fx .t{display:flex;align-items:center;gap:8px}.fx .t:last-child{justify-content:flex-end;text-align:right}.sc{font:700 20px "Barlow Condensed",sans-serif;background:var(--bg);padding:2px 12px;border-radius:6px;white-space:nowrap}
.ow{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--bd)}th{color:var(--mu);font-weight:500}td:nth-child(2),th:nth-child(2){text-align:left}td b{color:var(--tx)}
.tag{font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--bd);color:var(--mu);margin-left:6px}.tag.v{color:#4ade80;border-color:#4ade8066}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}label{display:grid;gap:3px;font-size:13px;color:var(--mu)}
.news{display:block}.cov{height:110px;border-radius:8px;margin-bottom:10px;background:linear-gradient(135deg,var(--bl),var(--ac));opacity:.85}
footer{border-top:1px solid var(--bd);padding:24px;text-align:center;color:var(--mu);font-size:13px}
:root{--bg:#0a0a0b;--card:#131315;--bd:#232327;--tx:#f5f5f3;--mu:#8b8b92;--ac:#d63a3a;--bl:#3a3a40}
body{font-family:Inter,Geist,'Segoe UI',system-ui,sans-serif;font-weight:450;letter-spacing:-.005em}
h1,h2,h3{font-family:inherit;text-transform:none;font-weight:800;letter-spacing:-.03em}h1{font-size:clamp(28px,4.5vw,42px);margin-bottom:1rem}h2{font-size:20px}h3{font-size:17px}
main{animation:none}main.x{animation:pg .28s ease}@keyframes pg{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){main.x{animation:none}}
.logo{font:800 16px Inter,sans-serif;letter-spacing:.04em}.logo i{background:var(--ac);border-radius:8px;font-size:11px;font-weight:800}
.links a{font-weight:500;border-radius:0}.links a.on{background:transparent;box-shadow:inset 0 -2px var(--ac)}.links a:hover{background:transparent;color:var(--tx)}
.hero{background:var(--card);padding:56px 32px}.hero h1{font-size:clamp(36px,7vw,66px);letter-spacing:-.045em}
.card{border-radius:10px}a.card:hover{border-color:#44444a;transform:none}
.bd{background:#1d1d21;border:1px solid var(--bd);color:var(--tx);font:700 10px Inter,sans-serif;letter-spacing:.04em}.bd.l{font-size:20px}
.cov{background:#1d1d21;opacity:1}.sc{font:800 17px Inter,sans-serif;background:#1d1d21}.tag,.tag.v{border-radius:4px;color:var(--mu);border-color:var(--bd)}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}button{border-radius:8px}.tb.on{background:var(--tx);color:#000;border-color:var(--tx)}
img.bd{border:0!important;border-radius:0!important;background:transparent!important;object-fit:contain!important}.bd{flex:none}
.bd{display:inline-grid;vertical-align:middle;margin:0}.cn,td a,.cc,.fx .t,.row.hd{display:inline-flex;align-items:center;gap:12px}.cn{display:flex}.cc{display:flex;gap:16px}.cc h3{margin:0 0 4px}.fx .t{display:flex}.fx .t h2{margin:0}h1,h2,h3{line-height:1.2}
.fm{display:flex;gap:8px}.fb{width:36px;height:36px;border-radius:6px;display:grid;place-items:center;font:800 15px Inter,sans-serif;color:#fff}.fb.W{background:#16a34a}.fb.D{background:#6b7280}.fb.L{background:#991b1b}.fb:hover{filter:brightness(1.15)}
.tw{padding:3px 12px;border-radius:99px;font:800 12px Inter,sans-serif;color:#fff}.tw.on{background:#16a34a}.tw.off{background:#b91c1c}
.twbn{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:24px;border-left:4px solid}.twbn.on{border-left-color:#16a34a}.twbn.off{border-left-color:#b91c1c}.twbn p{margin:0;color:var(--mu)}.twt{font:800 24px Inter,sans-serif;letter-spacing:-.02em}button:disabled{opacity:.4;cursor:not-allowed;filter:none}
</style></head><body>
<nav><div class="nw"><a class="logo" href="#home"><i>CBL</i>CONTINENTAL BLOX</a><div class="links" id="lk"></div>
<input id="q" placeholder="Search clubs, players, competitions" style="min-width:200px"></div></nav>
<main id="m"></main><footer>Continental Blox League · Not affiliated with Roblox Corporation · All records are entered manually by CBL administrators · Records tagged “Sample” are placeholder data</footer>
<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='cbl_v4';let admin=false,query='',at='Dashboard';
const BADGE={c1:'BADGE_DATA',c3:'BADGE_DATA',c4:'BADGE_DATA',c5:'BADGE_DATA',c2:'BADGE_DATA'};
const seed=()=>{const C=[['c1','Celtic','CEL'],['c2','Roma','ROM'],['c3','Chelsea','CHE'],['c4','Barcelona','BAR'],['c5','Real Madrid','RMA']];
const cols=['#c8102e','#2563eb','#059669','#d97706','#7c3aed','#db2777','#0891b2','#65a30d'];
const P=['GK','DEF','MID','FWD'],N=['England','Brazil','Spain','Germany'];
return{season:'Season 5',seasons:['Season 5','Season 4','Season 3','Season 2','Season 1'],
comps:[{id:'d1',name:'Division 1',type:'league'},{id:'cup',name:'Continental Blox Cup',type:'cup'}],
clubs:C.map(c=>({id:c[0],name:c[1],abbr:c[2],div:'d1',mgr:'',own:'',info:'',img:BADGE[c[0]]})),
players:Array.from({length:0},(_,i)=>({id:'p'+i,name:'Sample Player '+(i+1),rbx:'sample_user'+(i+1),club:'c'+(i%4+1),nat:N[i%4],pos:P[i%4],app:6,g:[5,3,2,0][i%4]+(i<4?2:0),a:i%4+1,cs:i%4==0?3:0,sample:true})),
fixtures:[['c1','c2','2026-10-04',2,1],['c3','c4','2026-10-04',0,0],['c1','c3','2026-10-11',3,1],['c4','c2','2026-10-11',1,2],['c1','c4','2026-11-15'],['c2','c3','2026-11-15']].map((f,i)=>({id:'f'+i,season:'Season 5',comp:'d1',home:f[0],away:f[1],date:f[2],hs:f[3]??null,as:f[4]??null,note:'',sample:true})).filter(()=>false),
transfers:[],
awards:[['Season 4','Division 1 Champions','Manchester United'],['Season 4','Best Club','Manchester United'],['Season 4','Blox D’Or','Viz'],['Season 4','Golden Glove','Jingle'],['Season 4','Best Defender','Greentea']].map((a,i)=>({id:'a'+i,season:a[0],award:a[1],winner:a[2],sample:false})),
news:[{id:'n0',title:'Welcome to the new CBL website',cat:'Official',date:'2026-11-01',body:'This is a sample article. Publish real news from the Admin dashboard.',sample:true}],tw:{open:false,by:'',t:''},accounts:[],contracts:[],offers:[],releases:[],notes:[],audit:[],man:{},cats:['Division 1 Champions','Best Club','Blox D’Or','Golden Boot','Golden Glove','Best Defender','Best Manager','Player of the Season']}};
let D;try{D=JSON.parse(localStorage.getItem(KEY))}catch(e){}D=D||seed();D.tw=D.tw||{open:false,by:'',t:''};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}};
const cl=id=>D.clubs.find(c=>c.id==id)||{name:'Free agent',col:'#555'},cn=id=>D.comps.find(c=>c.id==id)?.name||id;
const bd=(c,l)=>c.img?`<img class="bd ${l?'l':''}" src="${esc(c.img)}" alt="" style="object-fit:cover;background:var(--card)">`:`<span class="bd ${l?'l':''}">${esc(c.abbr||c.name.slice(0,3).toUpperCase())}</span>`;
const tg=s=>s.sample?'<span class="tag">Sample</span>':'<span class="tag v">Verified</span>';
const fd=d=>d?new Date(d+'T12:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'';
function table(comp){const R=D.clubs.filter(c=>c.div==comp).map(c=>({c,P:0,W:0,D:0,L:0,GF:0,GA:0}));
D.fixtures.filter(f=>f.season==D.season&&f.comp==comp&&f.hs!=null).forEach(f=>{const h=R.find(r=>r.c.id==f.home),a=R.find(r=>r.c.id==f.away);if(!h||!a)return;
h.P++;a.P++;h.GF+=+f.hs;h.GA+=+f.as;a.GF+=+f.as;a.GA+=+f.hs;if(f.hs>f.as){h.W++;a.L++}else if(f.hs<f.as){a.W++;h.L++}else{h.D++;a.D++}});
R.forEach(r=>{r.GD=r.GF-r.GA;r.Pts=r.W*3+r.D;const m=D.man&&D.man[r.c.id];if(m)Object.assign(r,m)});return R.sort((a,b)=>(a.pos||99)-(b.pos||99)||b.Pts-a.Pts||b.GD-a.GD||b.GF-a.GF)}
const tbl=comp=>{const r=table(comp);return `<div class="ow"><table><tr><th>#</th><th>Club</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr>${r.map((x,i)=>`<tr><td>${i+1}</td><td><a href="#club-${x.c.id}">${bd(x.c)} ${esc(x.c.name)}</a></td><td>${x.P}</td><td>${x.W}</td><td>${x.D}</td><td>${x.L}</td><td>${x.GF}</td><td>${x.GA}</td><td>${x.GD>0?'+':''}${x.GD}</td><td><b>${x.Pts}</b></td></tr>`).join('')||'<tr><td colspan=10 class=mu>No clubs yet</td></tr>'}</table></div>`};
const fx=f=>`<a class="fx" href="#match-${f.id}"><span class="t">${bd(cl(f.home))} ${esc(cl(f.home).name)}</span><span class="sc">${f.hs!=null?f.hs+' – '+f.as:'vs'}</span><span class="t">${esc(cl(f.away).name)} ${bd(cl(f.away))}</span></a><div class="sm mu" style="margin-top:-6px;text-align:center">${fd(f.date)} · ${esc(cn(f.comp))}</div>`;
const SF=()=>D.fixtures.filter(f=>f.season==D.season);
const res=()=>SF().filter(f=>f.hs!=null).sort((a,b)=>b.date.localeCompare(a.date)),up=()=>SF().filter(f=>f.hs==null).sort((a,b)=>a.date.localeCompare(b.date));
const nc=a=>`<a class="card news" href="#article-${a.id}"><div class="cov"></div><span class="sm mu">${esc(a.cat)} · ${fd(a.date)}</span>${tg(a)}<h3>${esc(a.title)}</h3></a>`;
const pl=p=>`<a class="card" href="#player-${p.id}"><b>${esc(p.name)}</b>${tg(p)}<div class="sm mu">${esc(p.pos)} · ${esc(cl(p.club).name)}</div><div class="sm">${p.g} goals · ${p.a} assists · ${p.app} apps</div></a>`;
const sec=(t,l)=>`<div class="sec"><h2>${t}</h2>${l?`<a class="mu sm" href="${l}">View all →</a>`:''}</div>`;
const V={
home:()=>`<div class="hero"><span class="mu">${esc(D.season)} · Now live</span><h1>The home of Roblox football</h1><p>Fixtures, tables, transfers and awards from the Continental Blox League.</p><div class="row"><a href="#fixtures"><button>Match centre</button></a><a href="#comp-d1"><button class="g">Division 1 table</button></a></div></div>
${twBanner()}<div class="grid"><div>${sec('Latest results','#fixtures')}<div class="card">${res().slice(0,5).map(fx).join('')||'<p class=mu>No results have been published yet.</p>'}</div></div><div>${sec('Upcoming fixtures','#fixtures')}<div class="card">${up().slice(0,5).map(fx).join('')||'<p class=mu>No fixtures have been scheduled yet.</p>'}</div></div></div>
<div class="grid">${D.comps.filter(c=>c.type=='league').slice(0,2).map(c=>`<div>${sec(esc(c.name),'#comp-'+c.id)}<div class="card">${tbl(c.id)}</div></div>`).join('')}</div>
${sec('Latest news','#news')}<div class="grid g3">${D.news.slice().reverse().slice(0,3).map(nc).join('')}</div>
${sec('Golden Boot race','#stats')}<div class="grid g3">${[...D.players].sort((a,b)=>b.g-a.g).slice(0,4).map(pl).join('')||'<p class=mu>Player statistics will appear once added by CBL administrators.</p>'}</div>`,
competitions:()=>`<h1>Competitions</h1><div class="grid g3">${D.comps.map(c=>`<a class="card" href="#comp-${c.id}"><h3>${esc(c.name)}</h3><span class="mu sm">${c.type=='league'?'League':'Knockout / tournament'}</span></a>`).join('')}</div>`,
comp:id=>{const c=D.comps.find(x=>x.id==id);if(!c)return nf();const w=D.awards.filter(a=>a.award==c.name+' Champions');
return `<h1>${esc(c.name)}</h1><p class="mu">${esc(D.season)} · switch season in the Admin dashboard</p>${c.type=='league'?sec('Standings')+`<div class="card">${tbl(c.id)}</div>`:''}
${sec('Fixtures & results')}<div class="card">${SF().filter(f=>f.comp==id).map(fx).join('')||'<span class=mu>No matches</span>'}</div>
${sec('Past winners')}<div class="card">${w.map(a=>`<div>${esc(a.season)} — <b>${esc(a.winner)}</b>${tg(a)}</div>`).join('')||'<span class=mu>No winners recorded</span>'}</div>`},
clubs:()=>`<h1>Clubs</h1><div class="grid g3">${D.clubs.map(c=>`<a class="card cc" href="#club-${c.id}">${bd(c,1)}<div><h3>${esc(c.name)}</h3><span class="mu sm">${esc(cn(c.div))}</span>${tg(c)}</div></a>`).join('')}</div>`,
club:id=>{const c=D.clubs.find(x=>x.id==id);if(!c)return nf();const t=table(c.div),pos=t.findIndex(r=>r.c.id==id)+1,r=t[pos-1]||{};const fs=SF().filter(f=>f.home==id||f.away==id);
return `<div class="row" style="align-items:center">${bd(c,1)}<div><h1>${esc(c.name)}</h1><span class="mu">${esc(cn(c.div))} · Position ${pos||'–'} · ${r.Pts??0} pts</span>${tg(c)}</div></div>
${sec('Last 5 matches')}${form(id)}<div class="grid"><div class="card">${c.info?'<p>'+esc(c.info)+'</p>':''}<b>Manager</b> ${esc(c.mgr||'TBC')}<br><b>Owner</b> ${esc(c.own||'TBC')}<br><b>Record</b> W${r.W||0} D${r.D||0} L${r.L||0} · GD ${r.GD||0}<br><b>Trophies</b> ${D.awards.filter(a=>a.winner==c.name).map(a=>esc(a.season+' '+a.award)).join(', ')||'None recorded'}</div>
<div class="card"><b>Transfers</b>${D.transfers.filter(t=>t.to==c.name||t.from==c.name).map(t=>`<div class="sm">${esc(t.player)}: ${esc(t.from)} → ${esc(t.to)}</div>`).join('')||'<div class="mu sm">None</div>'}</div></div>
${sec('Squad')}<div class="grid g3">${D.players.filter(p=>p.club==id).map(pl).join('')||'<span class=mu>No players</span>'}</div>
${sec('Results & fixtures')}<div class="card">${fs.map(fx).join('')||'<span class=mu>None</span>'}</div>`},
players:()=>{const o=k=>[...new Set(D.players.map(p=>p[k]))];return `<h1>Players</h1><div class="row"><select id="fp"><option value="">All positions</option>${o('pos').map(x=>`<option>${esc(x)}</option>`)}</select><select id="fc"><option value="">All clubs</option>${D.clubs.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`)}</select><select id="fn"><option value="">All nationalities</option>${o('nat').map(x=>`<option>${esc(x)}</option>`)}</select></div><div class="grid g3" id="pg"></div>`},
player:id=>{const p=D.players.find(x=>x.id==id);if(!p)return nf();const c=cl(p.club);
return `<div class="row" style="align-items:center">${p.img?bd({img:p.img},1):bd(c,1)}<div><h1>${esc(p.name)}</h1><span class="mu">@${esc(p.rbx)} · ${esc(p.pos)} · ${esc(p.nat)}</span>${tg(p)}</div></div>
<div class="card"><a href="#club-${c.id}"><b>${esc(c.name)}</b></a><div>${p.app} apps · ${p.g} goals · ${p.a} assists · ${p.cs} clean sheets</div><div class="mu sm">Awards: ${D.awards.filter(a=>a.winner==p.name).map(a=>esc(a.season+' '+a.award)).join(', ')||'none'}</div><div class="mu sm" style="white-space:pre-wrap">Career: ${esc(p.career||'')}${D.transfers.filter(t=>t.player==p.name).map(t=>'\n'+esc(t.from+' → '+t.to+' ('+fd(t.date)+')')).join('')||(p.career?'':'no recorded history')}</div></div>`},
fixtures:()=>`<h1>Fixtures & results</h1><div class="grid"><div>${sec('Upcoming')}<div class="card">${up().map(fx).join('')||'<span class=mu>None</span>'}</div></div><div>${sec('Results')}<div class="card">${res().map(fx).join('')||'<span class=mu>None</span>'}</div></div></div>`,
match:id=>{const f=D.fixtures.find(x=>x.id==id);if(!f)return nf();
return `<div class="card" style="text-align:center"><span class="mu">${esc(cn(f.comp))} · ${fd(f.date)}</span><div class="fx"><span class="t">${bd(cl(f.home),1)}<h2>${esc(cl(f.home).name)}</h2></span><span class="sc" style="font-size:40px">${f.hs!=null?f.hs+' – '+f.as:'vs'}</span><span class="t"><h2>${esc(cl(f.away).name)}</h2>${bd(cl(f.away),1)}</span></div>${f.note?`<p>${esc(f.note)}</p>`:'<p class=mu>No match report entered yet. Add scorers and a report from Admin → Enter result.</p>'}${tg(f)}</div>`},
transfers:()=>`<h1>Transfer centre</h1>${D.transfers.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(t=>`<div class="card" style="margin-bottom:10px"><b>${esc(t.player)}</b> <span class="tag">${esc(t.type)}</span>${tg(t)}<div class="cn">${bdn(t.from)}<span>${esc(t.from)}</span><span class="mu">→</span>${bdn(t.to)}<b>${esc(t.to)}</b></div><div class="sm mu">${fd(t.date)} · Fee: ${esc(t.fee||'n/a')}${t.loan?' · '+esc(t.loan):''}</div></div>`).join('')||'<p class=mu>No transfers</p>'}`,

aud(by,`${act=='rst'?'Reset password for':act=='sus'?'Suspended':act=='act'?'Reactivated':'Removed'} ${a.user}`)};
window.ccreate=async()=>{if(!admin)return;await mkAcct(gv('a_c'),gv('a_r'),[...document.querySelectorAll('.pf:checked')].map(x=>x.value),gv('a_u'),AN());go()};
window.defp=()=>{const d=DEF[gv('a_r')]||[];document.querySelectorAll('.pf').forEach(x=>x.checked=d.includes(x.value))};
window.loadacct=()=>{const a=D.accounts.find(x=>x.id==gv('ed_id'));if(!a)return;document.getElementById('ed_r').value=a.role;document.getElementById('ed_c').value=a.club;document.getElementById('ed_s').value=a.status;document.querySelectorAll('.ef').forEach(x=>x.checked=a.perms.includes(x.value))};
window.saveacct=()=>{if(!admin)return;const a=D.accounts.find(x=>x.id==gv('ed_id'));if(!a)return;a.role=gv('ed_r');a.club=gv('ed_c');a.status=gv('ed_s');a.perms=[...document.querySelectorAll('.ef:checked')].map(x=>x.value);aud(AN(),`Updated ${a.user}: ${a.role}, ${cl(a.club).name}, ${a.status}, ${a.perms.join('/')}`);save();go()};
window.aact=async(k,id,act)=>{if(!admin)return;const a=(k=='adm'?ADMS:D.accounts).find(x=>(x.id||x.user)==id);if(!a)return;
if(k=='adm'){if(!isSuper(adm)){alert('Only the super administrator can manage administrator accounts');return}if((act=='sus'||act=='rm')&&a.user==adm.user){alert('You cannot suspend or remove your own account.');return}
if((act=='sus'||act=='rm')&&a.status=='Active'&&ADMS.filter(x=>x.status=='Active').length<=1){alert('At least one administrator must stay active');return}
if(act=='rm'&&!confirm('Remove '+a.user+'?'))return;
if(act=='rst'){const pw=rnd(20);Object.assign(a,await hashPw(pw),{mustChange:true,fails:0,lock:0});issued.unshift({user:a.user,pw})}else if(act=='sus')a.status='Suspended';else if(act=='act')a.status='Active';else ADMS=ADMS.filter(x=>x!==a);
aud(AN(),`${act} administrator ${a.user}`);saveA();save();go();return}
await doAct(a,act,AN());save();go()};
window.acreate=async()=>{if(!admin||!isSuper(adm)){alert('Only the super administrator can create administrator accounts');return}const u=gv('na_u');if(!/^[A-Za-z0-9_.-]{3,32}$/.test(u)){alert('Username: 3-32 letters, digits, _ . -');return}if(ADMS.some(a=>lo(a.user)==lo(u))||D.accounts.some(a=>lo(a.user)==lo(u))){alert('Username already exists');return}const pw=rnd(20);ADMS.push({user:u,role:'CBL Administrator',status:'Active',mustChange:true,fails:0,lock:0,...await hashPw(pw)});issued.unshift({user:u,pw});aud(AN(),'Created administrator '+u);saveA();save();go()};
window.bcreate=async()=>{const m=need('board');if(!m)return;await mkAcct(m.club,'Board Member',[...document.querySelectorAll('.bf:checked')].map(x=>x.value).filter(f=>f!='board'&&has(m,f)),gv('bu'),m.user);go()};
window.bact=async(id,act)=>{const m=need('board'),a=D.accounts.find(x=>x.id==id);if(!m||!a||a.club!=m.club||a.role!='Board Member'){alert('Not permitted');return}await doAct(a,act,m.user);save();go()};
window.pchg=async()=>{const m=me(),r=i=>document.getElementById(i).value;if(!m)return;if(r('pc1').length<12||r('pc1')!=r('pc2')){alert('Use at least 12 characters and make both entries match');return}if(await kdf(r('pc0'),Uint8Array.from(m.salt))!=m.hash){alert('Current password is incorrect');return}Object.assign(m,await hashPw(r('pc1')),{mustChange:false});aud(m.user,'Changed own password');save();go()};
window.plogin=async()=>{const a=D.accounts.find(x=>lo(x.user)==lo(gv('pu'))),r=a&&a.status=='Active'?await verify(a,document.getElementById('pp').value,save):'bad';if(r=='ok'){S={id:a.id};pt='Overview';issued=[];aud(a.user,'Signed in');save();go()}else alert(r=='locked'?'Too many attempts. Try again in 5 minutes.':'Incorrect details, or the account is suspended')};
const _p=V.portal;V.portal=()=>{const m=me();if(m&&m.mustChange)return `<h1>Set a new password</h1><div class="card" style="max-width:380px"><label>Temporary password<input id="pc0" type="password"></label><label>New password (12+ characters)<input id="pc1" type="password"></label><label>Confirm<input id="pc2" type="password"></label><div class="row"><button onclick="pchg()">Save password</button><button class="g" onclick="plogout()">Sign out</button></div></div>`;return _p()};
const ACC=()=>{const cs=D.clubs.map(c=>[c.id,c.name]),fl=(cls,sel)=>FL.map(f=>`<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" class="${cls}" value="${f[0]}" ${sel.includes(f[0])?'checked':''}> ${f[1]}</label>`).join(''),
bt=(k,a,id)=>`<button class="g" onclick="aact('${k}','${id}','rst')">Reset password</button><button class="g" onclick="aact('${k}','${id}','${a.status=='Active'?'sus':'act'}')">${a.status=='Active'?'Suspend':'Reactivate'}</button><button class="g" onclick="aact('${k}','${id}','rm')">Remove</button>`,
row=(t,x)=>`<div class="sm" style="padding:8px 0;border-bottom:1px solid var(--bd)">${t}<div class="row">${x}</div></div>`;
return issuedCard()+`<div class="card" data-s="Accounts"><h3>CBL administrators</h3>${ADMS.map(a=>row(`<b>${esc(a.user)}</b> · ${isSuper(a)?'Super administrator':a.role} · ${a.status}${a.mustChange?' · password change pending':''}`,isSuper(adm)?bt('adm',a,a.user):'')).join('')||'<span class=mu>None</span>'}</div>
${isSuper(adm)?`<div class="card" data-s="Accounts"><h3>Create administrator (super administrator only)</h3><label>Username<input id="na_u"></label><div class="row"><button onclick="acreate()">Create and generate password</button></div></div>`:''}<div class="card" data-s="Accounts"><h3>Club accounts</h3>${D.accounts.map(a=>row(`<b>${esc(a.user)}</b> · ${a.role} · ${esc(cl(a.club).name)} · ${a.status}<br><span class="mu">${esc(a.perms.join(', ')||'no permissions')}</span>`,bt('club',a,a.id))).join('')||'<span class=mu>No club accounts yet</span>'}</div>
<div class="card" data-s="Accounts"><h3>Create club account</h3><label>Username (blank = generate)<input id="a_u"></label><label>Club<select id="a_c">${opt(cs)}</select></label><label>Role<select id="a_r" onchange="defp()">${opt(['Owner','Manager','Board Member'])}</select></label>${fl('pf',DEF.Owner)}<div class="row"><button onclick="ccreate()">Create and generate password</button></div></div>
<div class="card" data-s="Accounts"><h3>Edit club account</h3><label>Account<select id="ed_id" onchange="loadacct()">${opt(D.accounts.map(a=>[a.id,a.user]))}</select></label><label>Role<select id="ed_r">${opt(['Owner','Manager','Board Member'])}</select></label><label>Club<select id="ed_c">${opt(cs)}</select></label><label>Status<select id="ed_s">${opt(['Active','Suspended'])}</select></label>${fl('ef',[])}<div class="row"><button onclick="saveacct()">Save changes</button></div></div>`};
const twb=()=>`<span class="tw ${D.tw.open?'on':'off'}">${D.tw.open?'OPEN':'CLOSED'}</span>`,
twBanner=()=>`<div class="card twbn ${D.tw.open?'on':'off'}"><div><span class="mu sm">TRANSFER WINDOW</span><div class="twt">${D.tw.open?'\u{1F7E2} OPEN':'\u{1F534} CLOSED'}</div></div><p>${D.tw.open?'Transfers are currently open.':'The transfer window is currently closed.'}</p></div>`,
TWC=()=>`<div class="card" data-s="Transfer Window"><h3>Transfer window</h3><p>Status: ${twb()}</p><p class="sm mu">${D.tw.t?'Last changed by '+esc(D.tw.by)+' on '+D.tw.t:'Never changed. Default status is closed.'}</p><div class="row"><button onclick="twset(true)" ${D.tw.open?'disabled':''}>Open transfer window</button><button class="g" onclick="twset(false)" ${D.tw.open?'':'disabled'}>Close transfer window</button></div></div>`;
window.twset=o=>{if(!admin||!adm){alert('Administrator sign-in required');return}if(D.tw.open==o){alert('The transfer window is already '+(o?'open':'closed'));return}if(!o&&!confirm('Close the transfer window?'))return;D.tw={open:o,by:adm.user,t:now()};aud(adm.user,'Transfer window '+(o?'OPENED':'CLOSED'));save();go()};
const form=id=>{const f=D.fixtures.map((x,i)=>({...x,i})).filter(x=>x.hs!=null&&x.as!=null&&(x.home==id||x.away==id)).sort((a,b)=>b.date.localeCompare(a.date)||b.i-a.i).slice(0,5);
return f.length?`<div class="fm">${f.map(x=>{const h=x.home==id,g=h?+x.hs:+x.as,a=h?+x.as:+x.hs,r=g>a?'W':g<a?'L':'D',o=cl(h?x.away:x.home).name;return `<a class="fb ${r}" href="#match-${x.id}" title="${esc((h?'vs ':'at ')+o+' '+x.hs+'\u2013'+x.as)}">${r}</a>`}).join('')}</div>`:'<p class="mu">No completed matches yet.</p>'};
const NAV=[['home','Home'],['competitions','Competitions'],['clubs','Clubs'],['players','Players'],['fixtures','Fixtures & Results'],['transfers','Transfers'],['stats','Statistics'],['awards','Awards'],['news','News'],['about','About CBL'],['portal','Club Portal'],['admin','Admin']];
function go(){idle();const h=location.hash.slice(1)||'home',i=h.indexOf('-'),p=i<0?h:h.slice(0,i),id=h.slice(i+1);
const map={comp:'competitions',club:'clubs',player:'players',match:'fixtures',article:'news',season:'awards'};const on=map[p]||p;
document.getElementById('lk').innerHTML=NAV.map(n=>`<a href="#${n[0]}" class="${n[0]==on?'on':''}">${n[1]}</a>`).join('');
const v=V[p=='competitions'?'competitions':p]||nf;const M=document.getElementById('m');M.classList.remove('x');M.innerHTML=v(id);void M.offsetWidth;M.classList.add('x');if(p=='admin'&&admin)tab(at);
if(p=='players')['fp','fc','fn'].forEach(x=>document.getElementById(x).onchange=drawPlayers),drawPlayers();document.querySelectorAll('select[data-c]').forEach(s=>pre(s,s.dataset.c));if(p=='admin'&&admin&&document.getElementById('ed_id'))loadacct();window.scrollTo(0,0)}
document.getElementById('q').addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.value.trim()){query=e.target.value.trim();location.hash=location.hash=='#search'?'#search':'#search';go()}});
addEventListener('hashchange',go);go();
</script></body></html>
